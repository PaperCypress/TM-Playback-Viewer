<style>*{box-sizing:border-box}body{color:#eee;background:#1a1a1a;margin:0;font:14px sans-serif;overflow:hidden}#viewer{position:fixed;inset:0}#sidebar{z-index:5;background:#141414f0;border:1px solid #444;border-radius:8px;flex-direction:column;gap:12px;width:300px;padding:14px;display:flex;position:absolute;top:12px;bottom:12px;left:12px;box-shadow:0 4px 24px #0008}h2{margin:0;font-size:17px}.muted{color:#aaa;font-size:12px;line-height:1.45}button,select{color:#eee;font:inherit;background:#333;border:1px solid #555;border-radius:5px;padding:9px 10px}button{cursor:pointer}button:hover{background:#454545}button:disabled{opacity:.45;cursor:default}#chooseFolder{background:#176b63;border-color:#258e83}#sceneSelect{width:100%}#fileHeader{justify-content:space-between;align-items:center;display:flex}#bulkButtons{gap:6px;display:flex}#bulkButtons button{flex:1;padding:6px 8px;font-size:12px}#fileList{border-top:1px solid #444;flex-direction:column;flex:1;gap:2px;min-height:80px;padding-top:8px;display:flex;overflow-y:auto}.fileItem{cursor:pointer;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none;border-radius:5px;align-items:center;gap:8px;padding:7px 8px;font-size:12px;display:flex}.fileItem:hover{background:#2c2c2c}.fileItem.off{opacity:.45}.fileItem input{cursor:pointer;margin:0}.swatch{border-radius:50%;flex:none;width:12px;height:12px}.fileName{flex:1}#status{color:#aaa;min-height:18px;font-size:12px}#info{z-index:3;color:#fff;pointer-events:none;background:#000000ad;border-radius:6px;max-width:min(460px,100vw - 340px);padding:10px 14px;line-height:1.5;position:absolute;top:12px;right:50%}#info h3{margin:0 0 4px;font-size:15px}#telemetry{color:#ddd;white-space:pre-line;font-size:12px}#timeline{z-index:5;background:#141414f0;border:1px solid #444;border-radius:8px;align-items:center;gap:16px;padding:14px 20px;display:flex;position:absolute;bottom:12px;left:336px;right:12px;box-shadow:0 4px 24px #0008}#playBtn{background:#176b63;border-color:#258e83;border-radius:50%;flex:none;width:52px;height:52px;padding:0;font-size:22px}#timeLabel{text-align:right;flex:none;min-width:150px;font:15px/1.3 ui-monospace,Menlo,Consolas,monospace}#scrubber{appearance:none;cursor:ew-resize;touch-action:none;background:0 0;flex:1;min-width:0;height:44px;margin:0}#scrubber:focus{outline:none}#scrubber::-webkit-slider-runnable-track{background:#3a3a3a;border:1px solid #555;border-radius:7px;height:14px}#scrubber::-webkit-slider-thumb{-webkit-appearance:none;background:#2fd4c2;border:3px solid #0d3f3a;border-radius:50%;width:30px;height:30px;margin-top:-9px;box-shadow:0 0 0 1px #8ff}#scrubber::-moz-range-track{background:#3a3a3a;border:1px solid #555;border-radius:7px;height:14px}#scrubber::-moz-range-thumb{background:#2fd4c2;border:3px solid #0d3f3a;border-radius:50%;width:24px;height:24px}@media (width<=650px){#timeline{gap:10px;padding:10px 12px;left:296px}#timeLabel{min-width:0;font-size:12px}#sidebar{width:min(270px,100vw - 24px);top:10px;bottom:10px}#info{max-width:calc(100vw - 300px);top:auto;bottom:96px;right:50%}}</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
  <script type="module" crossorigin src="/assets/index-DICaEF7K.js"></script>
</head>
<body>
<div id="viewer"></div>

<aside id="sidebar">
    <h2>Timemachine Playback</h2>
    <div class="muted">Choose the data folder containing your Scenes</div>
    <button id="chooseFolder">Choose data folder</button>
    <a href="files/data.rar" download><button id="downloadExamples" style="width:100%;">Download Example Data</button></a>
    <input id="folderFallback" type="file" webkitdirectory multiple hidden>
    <label for="sceneSelect">Scene</label>
    <select id="sceneSelect" disabled><option value="">Choose a data folder first</option></select>
    <div id="fileHeader">
        <strong>Recordings</strong>
        <span id="fileCount" class="muted">0 files</span>
    </div>
    <div id="bulkButtons">
        <button id="showAll" disabled>Show all</button>
        <button id="hideAll" disabled>Hide all</button>
    </div>
    <div id="fileList"><div class="muted">No recordings loaded.</div></div>
    <div id="status">Waiting for data folder.</div>
</aside>

<div id="info">
    <h3 id="recordingTitle">3D Path Playback</h3>
    <div id="telemetry">Select a scene to begin.</div>
</div>

<div id="timeline">
    <button id="playBtn" title="Play / Pause (Space)">▶</button>
    <input id="scrubber" type="range" min="0" max="1" step="0.001" value="0" disabled>
    <div id="timeLabel">0.00 / 0.00 s</div>
</div>

</body>
</html>
